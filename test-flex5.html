<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="w-60 border-r flex flex-col gap-0.5 p-4 bg-gray-50">
    <!-- Regular SidebarNavItem link -->
    <a class="flex items-center gap-2.5 px-3 py-2 text-[13px] font-medium hover:bg-gray-200">
      <svg class="h-4 w-4 shrink-0 bg-red-200"></svg>
      <span class="flex-1 truncate">Inbox</span>
    </a>

    <!-- PluginSlotOutlet wrapper -->
    <div class="flex flex-col gap-0.5 text-[13px] font-medium">
      <!-- Button (Studio) -->
      <button class="flex w-full items-center gap-2.5 px-3 py-2 text-[13px] font-medium hover:bg-gray-200">
        <svg class="h-4 w-4 shrink-0 bg-blue-200"></svg>
        <span class="flex-1 truncate text-left">Studio (button text-left)</span>
      </button>

      <!-- A tag (Kitchen Sink) -->
      <a class="flex items-center gap-2.5 px-3 py-2 text-[13px] font-medium hover:bg-gray-200">
        <svg class="h-4 w-4 shrink-0 bg-green-200"></svg>
        <span class="flex-1 truncate">Kitchen Sink (a)</span>
      </a>

      <!-- Button (Studio) without text-left -->
      <button class="flex w-full items-center gap-2.5 px-3 py-2 text-[13px] font-medium hover:bg-gray-200">
        <svg class="h-4 w-4 shrink-0 bg-yellow-200"></svg>
        <span class="flex-1 truncate">Studio (button)</span>
      </button>
    </div>
  </div>
</body>
</html>
