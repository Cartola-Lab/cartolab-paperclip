<!DOCTYPE html>
<html>
<head>

</head>

      <span class="flex-1 truncate">Inbox</span>

    <div class="text-[13px] font-medium">
      <button class="flex w-full items-center gap-2.5 px-3 py-2 hover:bg-gray-200">

        <span class="flex-1 truncate">Studio (button)</span>
      </button>
    </div>
    <div class="text-[13px] font-medium">
      <a class="flex items-center gap-2.5 px-3 py-2 hover:bg-gray-200">
        <svg class="h-4 w-4 shrink-0 bg-green-200"></svg>
        <span class="flex-1 truncate">Kitchen Sink (a)</span>
      </a>
    </div>

</html>
